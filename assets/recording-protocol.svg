<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">LaSDAICVI recording protocol</title>
  <desc id="d">Six steps: consent and assent, a practice round, a first session of up to 25 minutes, a 10-minute break with a snack, a second session of up to 25 minutes, and manual labeling in Audacity. The two sessions give at least 10 samples per child and keyword.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#DDE5F8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2F5FE0" opacity="0.10"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
    <style>
      .card { fill: #FFFFFF; stroke: #BCC8EA; stroke-width: 1.5; }
      .card-hi { fill: #FFFFFF; stroke: #2F5FE0; stroke-width: 2; }
      .disc { fill: #EEF3FF; }
      .ttl { font: 800 17px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #141925; text-anchor: middle; }
      .det { font: 500 13.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #586278; text-anchor: middle; }
      .num { fill: #2F5FE0; }
      .numt { font: 800 13px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .arrow { fill: none; stroke: #5B8CFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .ink { fill: none; stroke: #2F5FE0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
  </g>

  <text x="56" y="64" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#141925">Recording protocol</text>
  <text x="57" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#586278">Followed once for each of the 41 children</text>

  <!-- arrows between steps -->
  <g class="arrow">
    <path d="M222 215 h18 m-7 -7 l7 7 -7 7"/>
    <path d="M427 215 h18 m-7 -7 l7 7 -7 7"/>
    <path d="M632 215 h18 m-7 -7 l7 7 -7 7"/>
    <path d="M837 215 h18 m-7 -7 l7 7 -7 7"/>
    <path d="M1042 215 h18 m-7 -7 l7 7 -7 7"/>
  </g>

  <!-- 1 consent -->
  <rect x="40" y="114" width="176" height="204" rx="20" class="card"/>
  <circle cx="64" cy="138" r="12" class="num"/><text x="64" y="143" class="numt">1</text>
  <circle cx="128" cy="172" r="36" class="disc"/>
  <rect x="112" y="150" width="30" height="40" rx="5" fill="#FFFFFF" stroke="#2F5FE0" stroke-width="2.5"/>
  <g stroke="#BCC8EA" stroke-width="2.5" stroke-linecap="round"><line x1="119" y1="161" x2="135" y2="161"/><line x1="119" y1="169" x2="135" y2="169"/><line x1="119" y1="177" x2="129" y2="177"/></g>
  <circle cx="143" cy="188" r="10" fill="#17935F"/>
  <path d="M138 188 l3.5 3.5 6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="240" class="ttl">Consent</text>
  <text x="128" y="266" class="det">Parents sign consent,</text>
  <text x="128" y="285" class="det">the child signs assent</text>

  <!-- 2 practice -->
  <rect x="245" y="114" width="176" height="204" rx="20" class="card"/>
  <circle cx="269" cy="138" r="12" class="num"/><text x="269" y="143" class="numt">2</text>
  <circle cx="333" cy="172" r="36" class="disc"/>
  <path d="M311 152 h44 a8 8 0 0 1 8 8 v18 a8 8 0 0 1 -8 8 h-26 l-9 9 1 -9 h-10 a8 8 0 0 1 -8 -8 v-18 a8 8 0 0 1 8 -8 z" fill="#2F5FE0"/>
  <text x="333" y="174" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">0–9</text>
  <text x="333" y="240" class="ttl">Practice</text>
  <text x="333" y="266" class="det">5 words and the</text>
  <text x="333" y="285" class="det">digits 0–9 to warm up</text>

  <!-- 3 session 1 -->
  <rect x="450" y="114" width="176" height="204" rx="20" class="card-hi"/>
  <circle cx="474" cy="138" r="12" class="num"/><text x="474" y="143" class="numt">3</text>
  <circle cx="538" cy="172" r="36" class="disc"/>
  <rect x="532" y="144" width="12" height="7" rx="2" fill="#2F5FE0"/>
  <circle cx="538" cy="176" r="20" fill="#FFFFFF" stroke="#2F5FE0" stroke-width="3"/>
  <line x1="538" y1="176" x2="538" y2="163" stroke="#2F5FE0" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 538 176" to="360 538 176" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="538" cy="176" r="3" fill="#2F5FE0"/>
  <text x="538" y="240" class="ttl">Session 1</text>
  <text x="538" y="266" class="det">Up to 25 minutes,</text>
  <text x="538" y="285" class="det">full vocabulary × 5</text>

  <!-- 4 break -->
  <rect x="655" y="114" width="176" height="204" rx="20" class="card"/>
  <circle cx="679" cy="138" r="12" class="num"/><text x="679" y="143" class="numt">4</text>
  <circle cx="743" cy="172" r="36" class="disc"/>
  <path d="M749 154 l6 -12 h8" class="ink"/>
  <rect x="729" y="154" width="28" height="38" rx="5" fill="#FFC44D" stroke="#2F5FE0" stroke-width="2.5"/>
  <rect x="734" y="166" width="18" height="12" rx="3" fill="#FFFFFF" opacity="0.8"/>
  <text x="743" y="240" class="ttl">Break</text>
  <text x="743" y="266" class="det">10 minutes</text>
  <text x="743" y="285" class="det">with a snack</text>

  <!-- 5 session 2 -->
  <rect x="860" y="114" width="176" height="204" rx="20" class="card-hi"/>
  <circle cx="884" cy="138" r="12" class="num"/><text x="884" y="143" class="numt">5</text>
  <circle cx="948" cy="172" r="36" class="disc"/>
  <rect x="942" y="144" width="12" height="7" rx="2" fill="#2F5FE0"/>
  <circle cx="948" cy="176" r="20" fill="#FFFFFF" stroke="#2F5FE0" stroke-width="3"/>
  <line x1="948" y1="176" x2="948" y2="163" stroke="#2F5FE0" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 948 176" to="360 948 176" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="948" cy="176" r="3" fill="#2F5FE0"/>
  <text x="948" y="240" class="ttl">Session 2</text>
  <text x="948" y="266" class="det">Up to 25 minutes,</text>
  <text x="948" y="285" class="det">full vocabulary × 5</text>

  <!-- 6 labeling -->
  <rect x="1065" y="114" width="176" height="204" rx="20" class="card"/>
  <circle cx="1089" cy="138" r="12" class="num"/><text x="1089" y="143" class="numt">6</text>
  <circle cx="1153" cy="172" r="36" class="disc"/>
  <path d="M1129 158 a4 4 0 0 1 4 -4 h12 l5 6 h19 a4 4 0 0 1 4 4 v24 a4 4 0 0 1 -4 4 h-36 a4 4 0 0 1 -4 -4 z" fill="#5B8CFF"/>
  <text x="1151" y="183" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">WAV</text>
  <text x="1153" y="240" class="ttl">Labeling</text>
  <text x="1153" y="266" class="det">Trimmed by hand in</text>
  <text x="1153" y="285" class="det">Audacity, one folder</text>
  <text x="1153" y="304" class="det">per keyword</text>

  <!-- sessions bracket -->
  <path d="M452 338 v12 a6 6 0 0 0 6 6 h566 a6 6 0 0 0 6 -6 v-12" fill="none" stroke="#2F5FE0" stroke-width="2"/>
  <rect x="611" y="342" width="268" height="30" rx="15" fill="#2F5FE0"/>
  <text x="745" y="362" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">≥ 10 samples per child and keyword</text>
</svg>
