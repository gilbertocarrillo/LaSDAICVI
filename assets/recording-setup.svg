<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="t d">
  <title id="t">LaSDAICVI recording setup</title>
  <desc id="d">A child wearing headphones sits 30 cm from a condenser microphone and repeats the keyword shown on a monitor next to an animation of the robot Pepe. Laptop 2 shows the slides and plays the prompt through the headphones; laptop 1 records with Audacity; the experimenter controls both.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#DDE5F8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#2F5FE0" opacity="0.10"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="540" rx="28"/></clipPath>
    <style>
      .lbl { font: 700 15px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #141925; }
      .sub { font: 500 13px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #586278; }
      .pill { fill: #FFFFFF; stroke: #BCC8EA; stroke-width: 1.5; }
      .num { fill: #2F5FE0; }
      .numt { font: 800 13px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .lead { stroke: #2F5FE0; stroke-width: 1.6; stroke-dasharray: 4 4; fill: none; }
      .cable { fill: none; stroke: #586278; stroke-width: 2.5; stroke-linecap: round; opacity: 0.55; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="540" fill="url(#bg)"/>
    <rect width="1280" height="540" fill="url(#dots)"/>
    <rect y="478" width="1280" height="62" fill="#DDE5F8"/>
    <line x1="0" y1="478" x2="1280" y2="478" stroke="#BCC8EA" stroke-width="2"/>
  </g>

  <!-- title -->
  <text x="56" y="64" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#141925">Recording setup</text>
  <text x="57" y="92" class="sub" font-size="15">Quiet room · two sessions of up to 25 minutes · 16 kHz mono</text>

  <!-- cables (behind everything) -->
  <path class="cable" d="M262 236 C250 330 300 470 420 472 L700 472 C735 472 752 440 752 330"/>
  <path class="cable" d="M440 470 L880 470 C905 470 912 440 905 330"/>
  <path class="cable" d="M672 296 C690 318 705 318 712 306"/>

  <!-- chair (child) -->
  <rect x="196" y="236" width="14" height="112" rx="7" fill="#AFBCE0"/>
  <rect x="196" y="334" width="118" height="14" rx="7" fill="#AFBCE0"/>
  <line x1="212" y1="348" x2="212" y2="474" stroke="#AFBCE0" stroke-width="8" stroke-linecap="round"/>
  <line x1="302" y1="348" x2="302" y2="474" stroke="#AFBCE0" stroke-width="8" stroke-linecap="round"/>

  <!-- child, seen from the side, facing the microphone -->
  <g>
    <rect x="250" y="314" width="92" height="26" rx="13" fill="#2F3A56"/>
    <rect x="320" y="326" width="22" height="118" rx="11" fill="#2F3A56"/>
    <ellipse cx="344" cy="450" rx="24" ry="10" fill="#141925"/>
    <rect x="222" y="250" width="64" height="92" rx="26" fill="#FF7A6B"/>
    <path d="M262 282 L312 316" stroke="#F2C29B" stroke-width="12" stroke-linecap="round"/>
    <circle cx="221" cy="204" r="15" fill="#3B2A20"/>
    <circle cx="252" cy="204" r="37" fill="#3B2A20"/>
    <circle cx="264" cy="214" r="33" fill="#F2C29B"/>
    <path d="M238 190 q26 -26 58 4 q-24 -12 -58 -4 z" fill="#3B2A20"/>
    <circle cx="284" cy="210" r="3.8" fill="#141925"/>
    <circle cx="281" cy="224" r="5" fill="#F08A8A" opacity="0.55"/>
    <ellipse cx="294" cy="229" rx="4.5" ry="3" fill="#8A3434">
      <animate attributeName="ry" values="1.5;4;1.5;3.5;1.5" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <!-- headphones -->
    <path d="M232 202 A34 34 0 0 1 290 186" fill="none" stroke="#141925" stroke-width="7" stroke-linecap="round"/>
    <rect x="248" y="198" width="22" height="32" rx="9" fill="#2F5FE0"/>
  </g>

  <!-- sound from the child's mouth to the microphone -->
  <g fill="none" stroke="#5B8CFF" stroke-width="3" stroke-linecap="round">
    <path d="M312 218 q8 11 0 22"><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M330 211 q12 18 0 36"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></path>
    <path d="M348 204 q16 25 0 50"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- 30 cm dimension -->
  <g stroke="#2F5FE0" stroke-width="2">
    <line x1="296" y1="278" x2="420" y2="278"/>
    <line x1="296" y1="270" x2="296" y2="286"/>
    <line x1="420" y1="270" x2="420" y2="286"/>
  </g>
  <rect x="330" y="257" width="56" height="20" rx="10" fill="#2F5FE0"/>
  <text x="358" y="272" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">30 cm</text>

  <!-- microphone -->
  <ellipse cx="432" cy="470" rx="34" ry="7" fill="#141925"/>
  <line x1="432" y1="468" x2="432" y2="250" stroke="#586278" stroke-width="6" stroke-linecap="round"/>
  <rect x="424" y="244" width="16" height="10" rx="3" fill="#586278"/>
  <rect x="420" y="200" width="24" height="46" rx="12" fill="#2F5FE0"/>
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.6">
    <line x1="426" y1="212" x2="438" y2="212"/>
    <line x1="426" y1="220" x2="438" y2="220"/>
    <line x1="426" y1="228" x2="438" y2="228"/>
  </g>

  <!-- table -->
  <rect x="500" y="336" width="12" height="138" rx="5" fill="#AFBCE0"/>
  <rect x="1000" y="336" width="12" height="138" rx="5" fill="#AFBCE0"/>
  <rect x="484" y="322" width="544" height="16" rx="8" fill="#FFFFFF" stroke="#AFBCE0" stroke-width="2"/>

  <!-- monitor with the slide -->
  <rect x="578" y="288" width="16" height="30" fill="#586278"/>
  <rect x="550" y="314" width="72" height="9" rx="4" fill="#586278"/>
  <rect x="490" y="138" width="192" height="152" rx="14" fill="#141925"/>
  <rect x="500" y="148" width="172" height="120" rx="8" fill="#FFFFFF"/>
  <g>
    <line x1="541" y1="172" x2="541" y2="164" stroke="#2F5FE0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="541" cy="161" r="3.5" fill="#5B8CFF"/>
    <rect x="518" y="172" width="46" height="38" rx="11" fill="#FFFFFF" stroke="#2F5FE0" stroke-width="2.5"/>
    <rect x="524" y="178" width="34" height="20" rx="7" fill="#141925"/>
    <circle cx="534" cy="188" r="3" fill="#5B8CFF"/>
    <circle cx="548" cy="188" r="3" fill="#5B8CFF"/>
    <rect x="524" y="212" width="34" height="34" rx="10" fill="#FFFFFF" stroke="#2F5FE0" stroke-width="2.5"/>
    <circle cx="541" cy="229" r="6" fill="#EEF3FF" stroke="#2F5FE0" stroke-width="2"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" fill="#2F5FE0" text-anchor="middle">
    <text x="620" y="228" font-size="58">7<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="5s" repeatCount="indefinite"/></text>
    <text x="620" y="218" font-size="24" opacity="0">jugar<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="5s" repeatCount="indefinite"/></text>
  </g>
  <rect x="512" y="254" width="148" height="6" rx="3" fill="#EEF3FF"/>

  <!-- laptop 2: slides -->
  <rect x="708" y="234" width="98" height="68" rx="7" fill="#141925"/>
  <rect x="714" y="240" width="86" height="54" rx="3" fill="#EEF3FF"/>
  <rect x="720" y="246" width="34" height="20" rx="2" fill="#FFFFFF" stroke="#BCC8EA"/>
  <rect x="760" y="246" width="34" height="20" rx="2" fill="#FFFFFF" stroke="#BCC8EA"/>
  <rect x="720" y="270" width="34" height="20" rx="2" fill="#FFFFFF" stroke="#2F5FE0" stroke-width="1.5"/>
  <rect x="760" y="270" width="34" height="20" rx="2" fill="#FFFFFF" stroke="#BCC8EA"/>
  <path d="M696 302 h122 l-8 20 h-106 z" fill="#AFBCE0"/>

  <!-- laptop 1: Audacity recording -->
  <rect x="838" y="222" width="126" height="80" rx="7" fill="#141925"/>
  <rect x="844" y="228" width="114" height="66" rx="3" fill="#0E1526"/>
  <circle cx="854" cy="238" r="4.5" fill="#FF5A5A"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="862" y="242" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#FF5A5A">REC</text>
  <polyline points="848,268 856,268 860,256 864,280 868,250 872,284 876,262 880,272 884,268 900,268 904,258 908,278 912,252 916,282 920,262 924,270 928,268 954,268" fill="none" stroke="#5B8CFF" stroke-width="2" stroke-linejoin="round"/>
  <path d="M826 302 h150 l-8 20 h-134 z" fill="#AFBCE0"/>

  <!-- experimenter -->
  <rect x="1082" y="334" width="112" height="14" rx="7" fill="#AFBCE0"/>
  <line x1="1092" y1="348" x2="1092" y2="474" stroke="#AFBCE0" stroke-width="8" stroke-linecap="round"/>
  <line x1="1184" y1="348" x2="1184" y2="474" stroke="#AFBCE0" stroke-width="8" stroke-linecap="round"/>
  <g>
    <rect x="1030" y="312" width="98" height="28" rx="14" fill="#2F3A56"/>
    <rect x="1030" y="324" width="24" height="120" rx="12" fill="#2F3A56"/>
    <ellipse cx="1028" cy="450" rx="26" ry="10" fill="#141925"/>
    <rect x="1088" y="222" width="76" height="120" rx="30" fill="#2F5FE0"/>
    <circle cx="1132" cy="176" r="39" fill="#3A2B22"/>
    <circle cx="1120" cy="186" r="35" fill="#D9A27A"/>
    <circle cx="1100" cy="182" r="4" fill="#141925"/>
    <path d="M1090 200 q8 6 16 2" fill="none" stroke="#5A2A1E" stroke-width="3" stroke-linecap="round"/>
    <path d="M1108 262 L1040 296 L980 310" fill="none" stroke="#D9A27A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- callouts -->
  <g>
    <path class="lead" d="M150 160 L248 206"/>
    <rect x="40" y="124" width="220" height="44" rx="14" class="pill"/>
    <circle cx="62" cy="146" r="11" class="num"/><text x="62" y="151" class="numt">1</text>
    <text x="80" y="143" class="lbl">Headphones</text>
    <text x="80" y="160" class="sub">play the keyword prompt</text>

    <path class="lead" d="M380 172 L426 200"/>
    <rect x="286" y="128" width="186" height="44" rx="14" class="pill"/>
    <circle cx="308" cy="150" r="11" class="num"/><text x="308" y="155" class="numt">2</text>
    <text x="326" y="147" class="lbl">Condenser mic</text>
    <text x="326" y="164" class="sub">16 kHz · mono</text>

    <path class="lead" d="M586 122 L586 138"/>
    <rect x="482" y="78" width="234" height="44" rx="14" class="pill"/>
    <circle cx="504" cy="100" r="11" class="num"/><text x="504" y="105" class="numt">3</text>
    <text x="522" y="97" class="lbl">Monitor</text>
    <text x="522" y="114" class="sub">keyword + robot Pepe animation</text>

    <path class="lead" d="M757 202 L757 234"/>
    <rect x="690" y="158" width="134" height="44" rx="14" class="pill"/>
    <circle cx="712" cy="180" r="11" class="num"/><text x="712" y="185" class="numt">4</text>
    <text x="730" y="177" class="lbl">Laptop 2</text>
    <text x="730" y="194" class="sub">slides + audio</text>

    <path class="lead" d="M901 168 L901 222"/>
    <rect x="836" y="124" width="166" height="44" rx="14" class="pill"/>
    <circle cx="858" cy="146" r="11" class="num"/><text x="858" y="151" class="numt">5</text>
    <text x="876" y="143" class="lbl">Laptop 1</text>
    <text x="876" y="160" class="sub">records in Audacity</text>

    <path class="lead" d="M1126 122 L1126 136"/>
    <rect x="1048" y="78" width="176" height="44" rx="14" class="pill"/>
    <circle cx="1070" cy="100" r="11" class="num"/><text x="1070" y="105" class="numt">6</text>
    <text x="1088" y="97" class="lbl">Experimenter</text>
    <text x="1088" y="114" class="sub">controls both laptops</text>
  </g>
</svg>
