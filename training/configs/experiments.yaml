# Experiment definitions for the 10 tasks of the thesis (Table 4.1: 10 tasks x CNN/GRU/CRNN x
# base/augmented = 60 rows).
#
# Provenance: every value below was read from the PARAMETERS cell of the thesis training
# notebooks (labels, unknown words, `epochs`, augmentation settings, batch size, learning rate).
# Epochs are 300 everywhere except the 400-epoch rows: base crnn of table4, table5, table8,
# table9 and pepe, and base gru of table9.
#
# `unknown` is the word list used by default. For `pepe`, `unknown_thesis` keeps the notebook
# list verbatim, including its typo '78' where '7' and '8' were meant; `--thesis` mode uses it to
# replay the published numbers (that word has no samples, so '78' and '9' contribute nothing).
defaults: {seed: 931001, validation_percentage: 0.25, test_percentage: 0.25, sampling_rate: 16000, n_aug_samples: 6,
  min_rate: 0.85, max_rate: 1.15, background_frequency: 0.8, min_snr_db: 5, max_snr_db: 30, audio_duration: 2000,
  n_mfcc: 20, n_mels: 40, n_ftt: 1024, hop_lenght: 512, batch_size: 128, learning_rate: 1.0e-05}
